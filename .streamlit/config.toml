[theme]
# Cadena de Frío / agroexport — teal reefer + sello oro (no verde SaaS genérico)
primaryColor = "#2BB8A8"
backgroundColor = "#060A10"
secondaryBackgroundColor = "#0C1219"
textColor = "#EAF0F6"
font = "sans serif"

[server]
headless = true
# Cortafuego Streamlit (capa servidor)
enableXsrfProtection = true
enableCORS = false
maxUploadSize = 25
maxMessageSize = 50
